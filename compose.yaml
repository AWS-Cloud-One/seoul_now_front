name: seoul-now-frontend

services:
  web:
    build:
      context: .
      target: development
    init: true
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5173}:5173'
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_KAKAO_MAP_APP_KEY: ${VITE_KAKAO_MAP_APP_KEY:-}
      API_PROXY_TARGET: ${DOCKER_API_PROXY_TARGET:-http://host.docker.internal:8000}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./src:/app/src
      - ./public:/app/public:ro
      - ./index.html:/app/index.html:ro
