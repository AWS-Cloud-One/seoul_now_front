name: seoul-now-frontend

services:
  web:
    build:
      context: .
      target: development
    init: true
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5173}:5173'
    env_file:
      - path: .env.local
        required: false
    environment:
      DOCKER_WATCH_POLLING: 'true'
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      API_PROXY_TARGET: ${DOCKER_API_PROXY_TARGET:-http://host.docker.internal:8000}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./vite.config.ts:/app/vite.config.ts:ro
      - ./src:/app/src
      - ./public:/app/public:ro
      - ./index.html:/app/index.html:ro
